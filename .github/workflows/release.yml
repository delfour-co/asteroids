# Delfour.co — Standard Release Pipeline for Flutter projects
# Synced from tools/ci-templates/ — do not edit manually
#
# Configuration via repository variables:
#   FLUTTER_VERSION   — Flutter version to pin (default: uses stable channel)
#   FLUTTER_CHANNEL   — Flutter channel (default: stable)
#   WORKING_DIR       — Working directory if project is nested (default: .)
#   HAS_FIREBASE      — Set to "true" if project uses Firebase (default: false)
#   BUILD_AAB         — Set to "true" to build App Bundle (default: false)
#   BUILD_APK         — Set to "true" to build APK (default: true)

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION || '' }}
  FLUTTER_CHANNEL: ${{ vars.FLUTTER_CHANNEL || 'stable' }}
  WORKING_DIR: ${{ vars.WORKING_DIR || '.' }}
  BUILD_APK: ${{ vars.BUILD_APK || 'true' }}
  BUILD_AAB: ${{ vars.BUILD_AAB || 'false' }}

jobs:
  # ──────────────────────────────────────────────
  #  1. Test — validate before building
  # ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION || '' }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Decode google-services.json
        if: ${{ vars.HAS_FIREBASE == 'true' }}
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  # ──────────────────────────────────────────────
  #  2. Build — signed APK and/or AAB
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "## Release $VERSION" >> "$GITHUB_STEP_SUMMARY"
        working-directory: .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION || '' }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode google-services.json
        if: ${{ vars.HAS_FIREBASE == 'true' }}
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          else
            echo "::error::No keystore configured — cannot create signed release"
            exit 1
          fi

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        if: ${{ env.BUILD_APK == 'true' }}
        run: flutter build apk --release

      - name: Build App Bundle
        if: ${{ env.BUILD_AAB == 'true' }}
        run: flutter build appbundle --release

      - name: Upload APK
        if: ${{ env.BUILD_APK == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Upload AAB
        if: ${{ env.BUILD_AAB == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: ${{ env.WORKING_DIR }}/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Build summary
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|------|" >> "$GITHUB_STEP_SUMMARY"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          [[ -f "$APK" ]] && echo "| APK | $(du -h "$APK" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          [[ -f "$AAB" ]] && echo "| AAB | $(du -h "$AAB" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  #  3. Release — GitHub Release + changelog
  # ──────────────────────────────────────────────
  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          {
            echo "## What's Changed"
            echo ""

            if [[ -n "$PREV_TAG" ]]; then
              # Categorize commits
              FEATS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges --grep="^feat" || true)
              FIXES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges --grep="^fix" || true)
              OTHERS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges --grep="^feat" --grep="^fix" --grep="^chore: bump" --invert-grep || true)

              if [[ -n "$FEATS" ]]; then
                echo "### Features"
                echo "$FEATS"
                echo ""
              fi
              if [[ -n "$FIXES" ]]; then
                echo "### Bug Fixes"
                echo "$FIXES"
                echo ""
              fi
              if [[ -n "$OTHERS" ]]; then
                echo "### Other"
                echo "$OTHERS"
                echo ""
              fi

              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.version.outputs.tag }}"
            else
              git log --pretty=format:"- %s (%h)" --no-merges -50
            fi
          } > /tmp/changelog.md

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: /tmp/changelog.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            /tmp/release-artifacts/release-apk/*.apk
            /tmp/release-artifacts/release-aab/*.aab
          fail_on_unmatched_files: false
